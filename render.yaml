services:
  - type: web
    name: gitmind-backend
    env: node
    plan: free
    rootDir: code
    buildCommand: npm install
    startCommand: npm run start:backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 4000
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PUBLIC_WEBHOOK_URL
        sync: false
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: ALLOWED_GITHUB_USERS
        sync: false
      - key: ALLOWED_REPOS
        sync: false

