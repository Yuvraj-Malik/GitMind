[build]
  # This is a monorepo; Netlify should install and build only the frontend.
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serve the React entry point for direct visits to client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
